<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pratica</title>
</head>
<body>
    
    <form action="#">
        
            <h1>Formulário de Cadastro</h1>
            <label for="nome">Nome</label><br>
            <input type="text" name="nome" id="nome" placeholder="Digite seu nome"><br>
            <label for="email">Email</label><br>
            <input type="email" name="email" id="email" placeholder="email@email.com"><br>
            <label for="senha">Senha</label><br>
            <input type="password" name="senha" id="senha" placeholder="Digite sua senha"><br>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
                    
    </form>

    <form action="#">

        <h1>Formulário de Contato</h1>
        <label for="nome">Nome</label><br>
        <input type="text" name="nome" id="nome"><br>
        <label for="email">Email</label><br>
        <input type="email" name="email" id="email"><br>
        <label for="telefone">Telefone </label><br>
        <input type="tel" name="telefone" id="telefone"><br>
        <label for="assunto">Assunto</label><br>
        <input type="text" name="assunto" id="assunto"><br>
        <label for="mensagem">Mensagem</label><br>
        <textarea name="mensagem" id="mensagem"></textarea><br>
        <input type="submit" value="enviar">
        <input type="reset" value="Limpar">

    </form>

    <form action="#">

        <H1>Formulário de Pesquisa</H1>
        <p>Qual seu nível de programação?</p>
        <label for="iniciante">Iniciante</label>
        <input type="radio" name="nivel" id="iniciante" value="iniciante"><br>
        <label for="intermediario">Intermediario</label>
        <input type="radio" name="nivel" id="intermediario" value="intermediario"><br>
        <label for="avançado">Avançado</label>
        <input type="radio" name="nivel" id="avançado" value="avançado"><br>
       
        <p>Qual linguagem você está estudando?</p>
        <label for="css">CSS</label>
        <input type="checkbox" name="linguagem" id="css" value="css"><br>
        <label for="html">HTML</label>
        <input type="checkbox" name="linguagem" id="html" value="html"><br>
        <label for="js">JS</label>
        <input type="checkbox" name="linguagem" id="js" value="js"><br>
        <label for="sql">SQL</label>
        <input type="checkbox" name="linguagem" id="sql" value="sql"><br>
        
        <p>Qual área você prefere?</p>
        <label for="front-end">Front-end</label>
        <input type="radio" name="area" id="front-end" value="front-end"><br>
        <label for="back-end">Back-end</label>
        <input type="radio" name="area" id="back-end" value="back-end"><br>
        <label for="full-stack">Full Stack</label>
        <input type="radio" name="area" id="full-stack" value="full-stack"><br>
        <input type="submit" value="enviar">
        <input type="reset" value="Limpar">

        <p><label for="pretensao-salarial">Pretensão salarial:</label></p>
        <select name="pretensao-salarial" id="pretensao-salarial">
            <option value="">Selecione um valor</option>
            <option value="1000">R$ 1.000</option>
            <option value="2000">R$ 2.000</option>
            <option value="3000">R$ 3.000</option>
        </select>

    </form>

    
   
</body>
</html>
