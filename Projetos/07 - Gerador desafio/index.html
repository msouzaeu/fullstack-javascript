<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <header>
            <h1>DESAFIO DEV</h1>
            <p>Seu desafio de hoje foi sorteado</p>
        </header>

        <section class="caixa-desafio">
            <h2>DESAFIO: <span id="desafio"></span></h2>
            <p>Pontuação: <span id="pontuacao"></span></p>
            <p>Nivel: <span id="nivel"></span></p>
            <p>Maior valor gerado: <span id="maiorValor"></span></p>
        </section>

        <section class="caixa-array">
            <h2>Tecnologias estudadas</h2>
            <p id="tecnologias"></p>
            <p>Total de tecnologias: <span id="total-tecnologia"></span></p>
            <p>Primeira tecnologia: <span id="primeira-tecnologia"></span></p>
            <p>Última tecnologia: <span id="ultima-tecnologia"></span></p>
            <p>É uma lista: <span id="validacao-array"></span></p>
            
        </section>

        <h3>ID binário: <span id="binario"></span></h3>

    </main>

    <script src="script.js"></script>
</body>

</html>
