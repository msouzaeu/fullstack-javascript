<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Contato</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/7a38d32aba.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <section class="container-geral">

        <div class="container-info">

            <div class="icone-planta">
                <i class="fa-solid fa-seedling"></i>
            </div>
            <h1>Vamos<br> conversar?</h1>
            <span class="line"></span>
            <p>Tem um projeto em mente ou precisa de ajuda com seu site? Ficarei feliz em atender suas ideias e transformar em uma solução digital que faz sentido para você.</p>

            <div class="caixa-email caixa-email-cidade-redes">

                <div class="icone-info">
                    <i class="fa-regular fa-envelope"></i>
                </div>
                <div class="dados-email">
                    <h3>E-mail</h3>
                    <span>mateuslima120@outlook.com</span>
                </div>
            </div>

            <div class="caixa-cidade caixa-email-cidade-redes">

                <div class="icone-info">
                    <i class="fa-solid fa-location-dot"></i>
                </div>
                <div class="dados-cidade">
                    <h3>Cidade</h3>
                    <span>Salvador, BA</span>
                </div>

            </div>

            <div class="caixa-rede caixa-email-cidade-redes">
                <div class="icone-info">
                    <i class="fa-solid fa-share-nodes"></i>
                </div>

                <div class="dados-redes">
                    <h3>Redes sociais</h3>
                    <div class="lista-redes">
                        <div class="caixa-linkedin-insta-github">
                           <a href="https://www.linkedin.com/in/mateussouzadev/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                        </div>
                        <div class="caixa-linkedin-insta-github">
                            <a href="https://www.linkedin.com/in/mateussouzadev/" target="_blank"><i class="fa-brands fa-linkedin"></i></a>
                        </div>
                        <div class="caixa-linkedin-insta-github">
                            <a href="https://github.com/msouzaeu" target="_blank"><i class="fa-brands fa-github"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <form class="container-form" action="#">

            <div class="caixa-form">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" class="caixa-input" placeholder="Escreva seu nome completo">
            </div>
            <div class="caixa-form">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" class="caixa-input" placeholder="seuemail@email.com.br">
            </div>
            <div class="caixa-form">
                <label for="assunto">Assunto</label>
                <select name="assunto" id="assunto" class="caixa-input" >
                    <option value="site" disabled selected>Selecione um assunto</option>
                    <option value="projeto">Projeto</option>
                    <option value="revisao">Revisão</option>
                    <option value="Estudo">Estudo</option>
                    <option value="site">Criação de site</option>
                </select>
            </div>

            <div class="caixa-form caixa-mensagem">
                <label for="mensagem">Mensagem</label>
                <textarea name="mensagem" id="mensagem" placeholder="Conte sobre seu projeto..."></textarea>
            </div>

            <button type="submit" class="btt-enviar"> <i class="fa-regular fa-paper-plane"></i> Enviar mensagem</button>
        </form>
    </section>
</body>

</html>
