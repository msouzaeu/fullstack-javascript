<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora IMC</title>
    <link rel="stylesheet" href="assets/style/style.css">
</head>

<body>

    <section class="container-imc">

        <h1>Tabela IMC</h1>
        <div class="base-resultado">
            <h2>IMC</h2>
            <P>Menos do que 18,5</P>
            <P>Entre 18,5 e 24,9</P>
            <P>Entre 25 e 29,9</P>
            <P>Entre 30 e 34,9</P>
            <P>Entre 35 e 39,9</P>
            <P>Mais do que 40</P>
        </div>

        <div class="base-resultado">
            <h2>Resultado</h2>
            <p>Abaixo do peso</p>
            <p>Peso normal</p>
            <p>Sobrepeso</p>
            <p>Obesidade grau 1</p>
            <p>Obesidade grau 2</p>
            <p>Obesidade grau 3</p>
        </div>

        <form action="" id="form">
            <h1>Calcule seu IMC</h1>

            <label for="peso">Peso:</label>
            <input type="text" id="peso">
            <label for="altura">Altura:</label>
            <input type="text" id="altura">
            <button type="submit" class="btt-calcular">Calcular</button>

        </form>

        <div class="resultado"></div>
        
    </section>


    <script src="assets/script/meuScript.js"></script>
</body>

</html>
